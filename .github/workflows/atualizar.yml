name: Atualizar calendário do Cruzeiro

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar os jogos mais recentes
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 buscar_jogos.py

      - name: Gerar o arquivo do calendário (.ics)
        run: python3 gerar_ics.py

      - name: Publicar a atualização automaticamente
        run: |
          git config user.name "robo-calendario"
          git config user.email "robo@users.noreply.github.com"
          git add jogos.json cruzeiro.ics
          git diff --quiet --cached || git commit -m "Atualização automática do calendário"
          git push
